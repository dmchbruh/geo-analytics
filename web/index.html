<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GeoAnalytics — Location Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #111827;
    }

    #topbar {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: #1f2937;
        color: #f3f4f6;
        box-sizing: border-box;
        position: relative;
        z-index: 1000;
    }

    #topbar h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
        margin-right: 8px;
    }

    .field-wrap {
        position: relative;
    }

    #cityInput {
        width: 220px;
        padding: 9px 12px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #111827;
        color: #f3f4f6;
        font-size: 13px;
        outline: none;
    }

    #cityInput:focus {
        border-color: #2563eb;
    }

    #suggestions {
        position: absolute;
        top: 40px;
        left: 0;
        width: 260px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 6px;
        max-height: 220px;
        overflow-y: auto;
        display: none;
    }

    #suggestions div {
        padding: 8px 12px;
        font-size: 13px;
        color: #e5e7eb;
        cursor: pointer;
    }

    #suggestions div:hover {
        background: #2563eb;
    }

    #businessSelect {
        padding: 9px 12px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #111827;
        color: #f3f4f6;
        font-size: 13px;
    }

    #analyzeBtn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    #analyzeBtn:hover {
        background: #1d4ed8;
    }

    #analyzeBtn:disabled {
        background: #4b5563;
        cursor: not-allowed;
    }

    .toggle-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #e5e7eb;
        font-size: 12px;
        white-space: nowrap;
    }

    #statusText {
        font-size: 12px;
        color: #9ca3af;
        margin-left: auto;
        max-width: 320px;
        text-align: right;
    }

    #statusText.error {
        color: #f87171;
    }

    #langBtn {
        background: none;
        border: 1px solid #374151;
        color: #9ca3af;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }

    #langBtn:hover {
        border-color: #6b7280;
        color: #e5e7eb;
    }

    #mapWrap {
        position: absolute;
        top: 64px;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
    }

    #map {
        flex: 1;
        height: 100%;
    }

    #sidebar {
        width: 300px;
        background: #1f2937;
        color: #e5e7eb;
        padding: 16px;
        overflow-y: auto;
        box-sizing: border-box;
        display: none;
        font-size: 13px;
    }

    #sidebar h2 {
        font-size: 14px;
        margin: 0 0 10px 0;
    }

    #sidebar .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #374151;
    }

    #sidebar .category-row span:first-child {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
    }

    #sidebar .top-zone {
        padding: 6px 0;
        border-bottom: 1px solid #374151;
        font-size: 12px;
    }

    #sidebar .top-zone-clickable {
        cursor: pointer;
        border-radius: 4px;
        padding: 6px 4px;
        transition: background 0.15s;
    }

    #sidebar .top-zone-clickable:hover {
        background: #374151;
    }

    #sidebar .top-zone-chain {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
    }

    .competitor-bar {
        display: flex;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 6px;
        margin-bottom: 2px;
    }

    .competitor-bar-chain {
        background: #f87171;
    }

    .competitor-bar-independent {
        background: #60a5fa;
    }

    .competitor-bar-legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
    }

    .competitor-bar-legend span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
    }

    .empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        pointer-events: none;
    }

    .leaflet-popup-content-wrapper {
        background: #1f2937;
        color: #e5e7eb;
    }

    .leaflet-popup-tip {
        background: #1f2937;
    }

    .popup-title {
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
    }

    .popup-section {
        margin-top: 6px;
        font-size: 12px;
    }

    .popup-section b {
        display: block;
        margin-bottom: 2px;
    }

    .popup-pro {
        color: #86efac;
    }

    .popup-con {
        color: #fca5a5;
    }

    .popup-competitor-bar {
        display: flex;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        margin: 4px 0 2px 0;
    }

    .popup-competitor-legend {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: #9ca3af;
    }
</style>
</head>
<body>

    <div id="topbar">
        <h1>GeoAnalytics</h1>

        <div class="field-wrap">
            <input type="text" id="cityInput" autocomplete="off" />
            <div id="suggestions"></div>
        </div>

        <select id="businessSelect">
            <option value="coffee_shop"></option>
            <option value="barbershop"></option>
        </select>

        <label class="toggle-label">
            <span id="labelDemand"></span>
            <input type="range" id="balanceSlider" min="0" max="100" value="70" style="width:100px" />
            <span id="labelCompetitors"></span>
        </label>

        <select id="sourceSelect">
            <option value="live"></option>
        </select>

        <button id="analyzeBtn"></button>

        <label class="toggle-label">
            <input type="checkbox" id="hideLowToggle" /> <span id="labelHideLow"></span>
        </label>

        <button id="langBtn">RU</button>

        <span id="statusText"></span>
    </div>

<div id="mapWrap">
    <div id="map"></div>
    <div id="sidebar"></div>
</div>
<div class="empty-state" id="emptyState"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
    const SERVER_URL = '';

    const TRANSLATIONS = {
        en: {
            pageTitle: 'GeoAnalytics — Location Intelligence',
            cityPlaceholder: 'City (e.g. London)',
            businessCoffee: 'Coffee Shop',
            businessBarber: 'Barbershop',
            labelDemand: 'Demand',
            labelCompetitors: 'Competition',
            sourceOnline: 'OpenStreetMap (online)',
            sourceOfflineSuffix: '(offline)',
            analyzeBtn: 'Analyze',
            labelHideLow: 'Hide low potential',
            emptyState: 'Results will appear here',
            statusInitial: 'Enter a city and click "Analyze"',
            statusAnalyzing: 'Analyzing, this may take up to a minute\u2026',
            statusDone: (n) => `Done: ${n} hexes analyzed`,
            statusError: (msg) => `Error: ${msg}`,
            statusNoCity: 'Please enter a city name',
            statusNoServer: 'Could not reach the server. Is GeoAnalyticsServer.exe running?',
            statusPartialFail: (parts) => `Warning: failed to load (${parts.join(', ')}). Try again in 20\u201330 sec.`,
            failCompetitors: 'competitors',
            failDemand: 'demand',
            failGrowth: 'construction',
            categoryLow: 'Low potential',
            categoryMedium: 'Medium potential',
            categoryHigh: 'Good potential',
            categoryVeryHigh: 'Excellent potential',
            sidebarSummary: 'Summary',
            sidebarTotalHexes: 'Total hexes',
            sidebarCompetitors: 'Competitors found',
            sidebarDemand: 'Demand points',
            sidebarConstruction: 'Construction points',
            sidebarCompetition: 'Competition structure',
            sidebarByCategory: 'By category',
            sidebarTopZones: 'Top zones',
            sidebarChains: (n, names) => names.length > 0 ? `Chains: ${names.join(', ')}` : `Chains: ${n}`,
            sidebarIndependentOnly: 'Independent competitors only',
            popupScore: 'score',
            popupCompetitorsNearby: 'Competitors nearby',
            popupDemandSignal: 'Demand signal',
            popupInvestment: 'Investment score',
            popupChains: 'Chains',
            popupPros: 'Pros',
            popupCons: 'Cons',
            barChains: 'Chains',
            barIndependent: 'Independent',
            proNoCompetitors: 'No direct competitors nearby',
            proFewCompetitors: (n) => `Few competitors nearby (${n})`,
            proNoChains: 'Only independent competitors — no major chains',
            proHighDemand: 'High potential demand',
            proGrowth: '🚧 New development nearby — growing demand',
            conHighCompetition: (n) => `High competition (${n} nearby)`,
            conChains: (n, names) => `${n} chain(s) nearby (${names.join(', ')})`,
            conOneChain: (name) => `Chain nearby: ${name}`,
            conLowDemand: 'Low potential demand in this area',
            conNone: '—',
            proNone: '—',
        },
        ru: {
            pageTitle: 'GeoAnalytics — анализ локаций',
            cityPlaceholder: 'Город (например, Тбилиси)',
            businessCoffee: 'Кофейня',
            businessBarber: 'Барбершоп',
            labelDemand: 'Спрос',
            labelCompetitors: 'Конкуренты',
            sourceOnline: 'OpenStreetMap (онлайн)',
            sourceOfflineSuffix: '(офлайн)',
            analyzeBtn: 'Анализировать',
            labelHideLow: 'Скрыть низкий потенциал',
            emptyState: 'Результат появится здесь',
            statusInitial: 'Введите город и нажмите "Анализировать"',
            statusAnalyzing: 'Анализируем, это может занять до минуты\u2026',
            statusDone: (n) => `Готово: ${n} гексов проанализировано`,
            statusError: (msg) => `Ошибка: ${msg}`,
            statusNoCity: 'Введите название города',
            statusNoServer: 'Не удалось связаться с сервером. Запущен ли GeoAnalyticsServer.exe?',
            statusPartialFail: (parts) => `Внимание: не удалось загрузить (${parts.join(', ')}). Попробуйте через 20–30 сек.`,
            failCompetitors: 'конкуренты',
            failDemand: 'спрос',
            failGrowth: 'застройка',
            categoryLow: 'Низкий потенциал',
            categoryMedium: 'Средний потенциал',
            categoryHigh: 'Хороший потенциал',
            categoryVeryHigh: 'Отличный потенциал',
            sidebarSummary: 'Сводка',
            sidebarTotalHexes: 'Всего гексов',
            sidebarCompetitors: 'Найдено конкурентов',
            sidebarDemand: 'Точек спроса',
            sidebarConstruction: 'Точек застройки',
            sidebarCompetition: 'Структура конкуренции',
            sidebarByCategory: 'По категориям',
            sidebarTopZones: 'Топ зон',
            sidebarChains: (n, names) => names.length > 0 ? `Сети: ${names.join(', ')}` : `Сети: ${n}`,
            sidebarIndependentOnly: 'Только частные конкуренты',
            popupScore: 'балл',
            popupCompetitorsNearby: 'Конкурентов рядом',
            popupDemandSignal: 'Индикатор спроса',
            popupInvestment: 'Инвестиционный потенциал',
            popupChains: 'Сети',
            popupPros: 'Плюсы',
            popupCons: 'Минусы',
            barChains: 'Сети',
            barIndependent: 'Частные',
            proNoCompetitors: 'Нет прямых конкурентов рядом',
            proFewCompetitors: (n) => `Мало конкурентов рядом (${n})`,
            proNoChains: 'Только частные конкуренты — нет крупных сетей',
            proHighDemand: 'Высокий потенциальный спрос',
            proGrowth: '🚧 Рядом строится новый район — растущий спрос',
            conHighCompetition: (n) => `Высокая конкуренция (${n} рядом)`,
            conChains: (n, names) => `Рядом ${n} сетевых заведений (${names.join(', ')})`,
            conOneChain: (name) => `Рядом сетевое заведение: ${name}`,
            conLowDemand: 'Низкий потенциальный спрос в этой зоне',
            conNone: '—',
            proNone: '—',
        }
    };

    let currentLang = 'en';

    function t() {
        return TRANSLATIONS[currentLang];
    }

    function applyTranslations() {
        const tr = t();

        document.title = tr.pageTitle;
        document.getElementById('cityInput').placeholder = tr.cityPlaceholder;
        document.getElementById('labelDemand').textContent = tr.labelDemand;
        document.getElementById('labelCompetitors').textContent = tr.labelCompetitors;
        document.getElementById('analyzeBtn').textContent = tr.analyzeBtn;
        document.getElementById('labelHideLow').textContent = tr.labelHideLow;
        document.getElementById('emptyState').textContent = tr.emptyState;
        document.getElementById('langBtn').textContent = currentLang === 'en' ? 'RU' : 'EN';

        const businessSelect = document.getElementById('businessSelect');
        businessSelect.options[0].textContent = tr.businessCoffee;
        businessSelect.options[1].textContent = tr.businessBarber;

        const sourceSelect = document.getElementById('sourceSelect');
        sourceSelect.options[0].textContent = tr.sourceOnline;
        for (let i = 1; i < sourceSelect.options.length; i++) {
            const key = sourceSelect.options[i].value;
            sourceSelect.options[i].textContent =
                key.charAt(0).toUpperCase() + key.slice(1) + ' ' + tr.sourceOfflineSuffix;
        }

        const statusEl = document.getElementById('statusText');
        if (statusEl.dataset.state === 'initial' || !statusEl.dataset.state) {
            statusEl.textContent = tr.statusInitial;
        }

        if (lastGeoJson && lastSummaryData) {
            renderSidebar(
                lastSummaryData.summary,
                lastGeoJson,
                lastSummaryData.competitorCount,
                lastSummaryData.demandCount,
                lastSummaryData.growthCount
            );
        }
    }

    const map = L.map('map', { zoomControl: true }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let geoLayer = null;
    let lastGeoJson = null;
    let lastSummaryData = null;
    let hexLayers = {};

    const categoryColors = {
        LOW: '#ff0000',
        MEDIUM: '#ffff00',
        HIGH: '#90ee90',
        VERY_HIGH: '#00aa00'
    };

    function categoryLabel(key) {
        return {
            LOW: t().categoryLow,
            MEDIUM: t().categoryMedium,
            HIGH: t().categoryHigh,
            VERY_HIGH: t().categoryVeryHigh
        }[key] || key;
    }

    function setStatus(text, isError, state) {
        const el = document.getElementById('statusText');
        el.textContent = text;
        el.className = isError ? 'error' : '';
        el.dataset.state = state || '';
    }

    function styleForFeature(feature) {
        const p = feature.properties || {};

        if (p.style && p.style.fill) {
            return {
                fillColor: p.style.fill,
                fillOpacity: p.style['fill-opacity'] ?? 0.6,
                color: p.style.stroke || '#333333',
                weight: p.style['stroke-width'] ?? 1
            };
        }

        return {
            fillColor: categoryColors[p.category] || '#999999',
            fillOpacity: 0.6,
            color: '#333333',
            weight: 1
        };
    }

    function buildCompetitorBarHtml(chainCount, independentCount, cssClass) {
        const total = chainCount + independentCount;

        if (total === 0) {
            return '';
        }

        const chainPct = Math.round((chainCount / total) * 100);
        const indPct = 100 - chainPct;

        return `
            <div class="${cssClass}-bar">
                <div class="${cssClass}-bar-chain" style="width:${chainPct}%"></div>
                <div class="${cssClass}-bar-independent" style="width:${indPct}%"></div>
            </div>
            <div class="${cssClass}-legend">
                <span><span class="legend-dot" style="background:#f87171"></span>${t().barChains}: ${chainCount}</span>
                <span><span class="legend-dot" style="background:#60a5fa"></span>${t().barIndependent}: ${independentCount}</span>
            </div>
        `;
    }

    function buildProsCons(p) {
        const tr = t();
        const pros = [];
        const cons = [];

        if (p.points_count === 0) {
            pros.push(tr.proNoCompetitors);
        } else if (p.points_count <= 2) {
            pros.push(tr.proFewCompetitors(p.points_count));
        } else if (p.points_count >= 8) {
            cons.push(tr.conHighCompetition(p.points_count));
        }

        if (p.chain_count >= 2) {
            cons.push(tr.conChains(p.chain_count, p.chain_names || []));
        } else if (p.chain_count === 1) {
            cons.push(tr.conOneChain((p.chain_names || [])[0]));
        } else if (p.chain_count === 0 && p.points_count > 0) {
            pros.push(tr.proNoChains);
        }

        if (p.demand_count >= 50) {
            pros.push(tr.proHighDemand);
        } else if (p.demand_count <= 5) {
            cons.push(tr.conLowDemand);
        }

        if (p.growth_count > 0) {
            pros.push(tr.proGrowth);
        }

        if (pros.length === 0) pros.push(tr.proNone);
        if (cons.length === 0) cons.push(tr.conNone);

        return { pros, cons };
    }

    function popupHtml(p) {
        const tr = t();
        const { pros, cons } = buildProsCons(p);

        const prosHtml = pros.map(x => '<div class="popup-pro">+ ' + x + '</div>').join('');
        const consHtml = cons.map(x => '<div class="popup-con">- ' + x + '</div>').join('');

        const chainCount = p.chain_count || 0;
        const independentCount = p.independent_count || 0;
        const competitorBarHtml = buildCompetitorBarHtml(chainCount, independentCount, 'popup-competitor');

        const chainsLine = p.chain_names && p.chain_names.length > 0
            ? `<div style="font-size:11px;color:#9ca3af;margin-top:2px">${tr.popupChains}: ${p.chain_names.join(', ')}</div>`
            : '';

        return `
            <div class="popup-title">${categoryLabel(p.category)} · ${tr.popupScore} ${Number(p.score).toFixed(1)}</div>
            <div>${tr.popupCompetitorsNearby}: ${p.points_count}</div>
            ${competitorBarHtml}
            ${chainsLine}
            <div style="margin-top:4px">${tr.popupDemandSignal}: ${p.demand_count}</div>
            <div>${tr.popupInvestment}: ${Number(p.investment_score).toFixed(0)}${p.growth_count > 0 ? ' 🚧' : ''}</div>
            <div class="popup-section"><b>${tr.popupPros}</b>${prosHtml}</div>
            <div class="popup-section"><b>${tr.popupCons}</b>${consHtml}</div>
        `;
    }

    function renderGeoJson(geojson) {
        if (geoLayer) {
            map.removeLayer(geoLayer);
        }

        hexLayers = {};

        geoLayer = L.geoJSON(geojson, {
            style: styleForFeature,
            onEachFeature: (feature, layer) => {
                layer.bindPopup(popupHtml(feature.properties || {}));
                layer.on('mouseover', () => layer.setStyle({ weight: 3 }));
                layer.on('mouseout', () => layer.setStyle({ weight: 1 }));

                const hexId = (feature.properties || {}).hex_id;

                if (hexId) {
                    hexLayers[hexId] = layer;
                }
            }
        }).addTo(map);

        const bounds = geoLayer.getBounds();

        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [20, 20] });
        }

        document.getElementById('emptyState').style.display = 'none';
    }

    function applyFilterAndRender() {
        if (!lastGeoJson) {
            return;
        }

        const hideLow = document.getElementById('hideLowToggle').checked;

        const filtered = {
            type: 'FeatureCollection',
            features: hideLow
                ? lastGeoJson.features.filter(f => f.properties.category !== 'LOW')
                : lastGeoJson.features
        };

        renderGeoJson(filtered);
    }

    function computeChainTotals(geojson) {
        let totalChain = 0;
        let totalIndependent = 0;

        (geojson.features || []).forEach(f => {
            const p = f.properties || {};
            totalChain += p.chain_count || 0;
            totalIndependent += p.independent_count || 0;
        });

        return { totalChain, totalIndependent };
    }

    function renderSidebar(summary, geojson, competitorCount, demandCount, growthCount) {
        const tr = t();
        const sidebar = document.getElementById('sidebar');
        sidebar.style.display = 'block';

        const dist = summary.category_distribution || {};

        let categoryRows = '';
        for (const key of ['VERY_HIGH', 'HIGH', 'MEDIUM', 'LOW']) {
            const count = dist[key] || 0;
            categoryRows += `
                <div class="stat-row category-row">
                    <span><span class="dot" style="background:${categoryColors[key]}"></span>${categoryLabel(key)}</span>
                    <span>${count}</span>
                </div>
            `;
        }

        const { totalChain, totalIndependent } = computeChainTotals(geojson);
        const competitorBarHtml = buildCompetitorBarHtml(totalChain, totalIndependent, 'competitor-bar');

        let topZonesHtml = '';
        (summary.top_zones || []).forEach(zone => {
            const zoneFeature = (geojson.features || []).find(
                f => f.properties && f.properties.hex_id === zone.hex_id
            );
            const zoneProps = zoneFeature ? zoneFeature.properties : {};
            const chainCount = zoneProps.chain_count || 0;
            const indCount = zoneProps.independent_count || 0;
            const chainNames = zoneProps.chain_names || [];

            let chainLine = '';
            if (chainCount > 0) {
                chainLine = `<div class="top-zone-chain">${tr.sidebarChains(chainCount, chainNames)}</div>`;
            } else if (indCount > 0) {
                chainLine = `<div class="top-zone-chain">${tr.sidebarIndependentOnly}</div>`;
            }

            topZonesHtml += `
                <div class="top-zone top-zone-clickable" data-hex-id="${zone.hex_id}">
                    <div>#${zone.rank} · ${tr.popupScore} ${Number(zone.score).toFixed(1)} · ${categoryLabel(zone.category)}</div>
                    <div style="font-size:11px;color:#9ca3af">${zone.hex_id}</div>
                    ${chainLine}
                </div>
            `;
        });

        sidebar.innerHTML = `
            <h2>${tr.sidebarSummary}</h2>
            <div class="stat-row"><span>${tr.sidebarTotalHexes}</span><span>${summary.hex_count}</span></div>
            <div class="stat-row"><span>${tr.sidebarCompetitors}</span><span>${competitorCount}</span></div>
            <div class="stat-row"><span>${tr.sidebarDemand}</span><span>${demandCount}</span></div>
            <div class="stat-row"><span>${tr.sidebarConstruction}</span><span>${growthCount}</span></div>
            <h2 style="margin-top:16px">${tr.sidebarCompetition}</h2>
            ${competitorBarHtml}
            <h2 style="margin-top:16px">${tr.sidebarByCategory}</h2>
            ${categoryRows}
            <h2 style="margin-top:16px">${tr.sidebarTopZones}</h2>
            ${topZonesHtml}
        `;

        sidebar.querySelectorAll('.top-zone-clickable').forEach(el => {
            el.addEventListener('click', () => {
                const hexId = el.dataset.hexId;
                const layer = hexLayers[hexId];

                if (!layer) {
                    return;
                }

                const bounds = layer.getBounds();

                if (bounds.isValid()) {
                    map.fitBounds(bounds, { maxZoom: 14, padding: [60, 60] });
                }

                layer.openPopup();
            });
        });
    }

    async function runAnalysis() {
        const city = document.getElementById('cityInput').value.trim();
        const business = document.getElementById('businessSelect').value;
        const btn = document.getElementById('analyzeBtn');

        if (!city) {
            setStatus(t().statusNoCity, true);
            return;
        }

        btn.disabled = true;
        setStatus(t().statusAnalyzing, false, 'analyzing');

        try {
            const source = document.getElementById('sourceSelect').value;
            const balance = document.getElementById('balanceSlider').value;
            const demandWeight = balance / 100;
            const competitorWeight = 1 - demandWeight;

            const url = SERVER_URL
                + '/analyze?city=' + encodeURIComponent(city)
                + '&business=' + encodeURIComponent(business)
                + '&source=' + encodeURIComponent(source)
                + '&demand_weight=' + demandWeight
                + '&competitor_weight=' + competitorWeight;

            const response = await fetch(url);
            const data = await response.json();

            if (data.error) {
                setStatus(t().statusError(data.error), true, 'error');
                btn.disabled = false;
                return;
            }

            lastGeoJson = data.geojson;
            lastSummaryData = {
                summary: data.summary,
                competitorCount: data.competitor_count,
                demandCount: data.demand_count,
                growthCount: data.growth_count
            };

            applyFilterAndRender();
            renderSidebar(data.summary, data.geojson, data.competitor_count, data.demand_count, data.growth_count);

            const failedParts = [];
            if (data.competitor_fetch_failed) failedParts.push(t().failCompetitors);
            if (data.demand_fetch_failed) failedParts.push(t().failDemand);
            if (data.growth_fetch_failed) failedParts.push(t().failGrowth);

            if (failedParts.length > 0) {
                setStatus(t().statusPartialFail(failedParts), true, 'warn');
            } else {
                setStatus(t().statusDone(data.summary.hex_count), false, 'done');
            }
        } catch (err) {
            setStatus(t().statusNoServer, true, 'error');
        }

        btn.disabled = false;
    }

    document.getElementById('analyzeBtn').addEventListener('click', runAnalysis);
    document.getElementById('hideLowToggle').addEventListener('change', applyFilterAndRender);

    document.getElementById('cityInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('suggestions').style.display = 'none';
            runAnalysis();
        }
    });

    document.getElementById('langBtn').addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'ru' : 'en';
        applyTranslations();

        if (lastGeoJson) {
            applyFilterAndRender();
        }
    });

    let debounceTimer = null;

    document.getElementById('cityInput').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);

        const query = e.target.value.trim();
        const suggestionsBox = document.getElementById('suggestions');

        if (query.length < 3) {
            suggestionsBox.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&limit=5&accept-language=en';
                const response = await fetch(url);
                const results = await response.json();

                if (!results.length) {
                    suggestionsBox.style.display = 'none';
                    return;
                }

                suggestionsBox.innerHTML = '';

                results.forEach(place => {
                    const item = document.createElement('div');
                    item.textContent = place.display_name;
                    item.addEventListener('click', () => {
                        document.getElementById('cityInput').value = place.display_name.split(',')[0];
                        suggestionsBox.style.display = 'none';
                    });
                    suggestionsBox.appendChild(item);
                });

                suggestionsBox.style.display = 'block';
            } catch (err) {
                suggestionsBox.style.display = 'none';
            }
        }, 400);
    });

    (async () => {
        try {
            const response = await fetch(SERVER_URL + '/pbf-sources');
            const sources = await response.json();
            const select = document.getElementById('sourceSelect');
            const tr = t();

            sources.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = key.charAt(0).toUpperCase() + key.slice(1) + ' ' + tr.sourceOfflineSuffix;
                select.appendChild(opt);
            });
        } catch (err) {
        }
    })();

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.field-wrap')) {
            document.getElementById('suggestions').style.display = 'none';
        }
    });

    applyTranslations();
    setStatus(t().statusInitial, false, 'initial');
</script>

</body>
</html>
